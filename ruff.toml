target-version = "py312"
line-length = 100

[lint]
# F = pyflakes (real bugs), B = bugbear, I = import sort, UP = pyupgrade
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length — handled by judgement/formatter; SQLAlchemy lines run long
    "E712",  # `== True` — required by SQLAlchemy filter expressions
    "B008",  # function call in arg default — that's how FastAPI Depends() works
    "B904",  # raise-from in except — noisy for HTTPException translation
]

[lint.per-file-ignores]
# __init__.py files intentionally re-export names for a flat public API
"__init__.py" = ["F401"]
# `status` query param intentionally shadows the fastapi.status import here
"app/api/v1/endpoints/conversations.py" = ["F811"]
"alembic/*" = ["E501"]
"tests/*" = ["E501"]
