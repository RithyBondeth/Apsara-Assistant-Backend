[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    # python-jose calls datetime.utcnow() when it checks token expiry. Nothing
    # in app/ does any more — see app/core/clock.py — so this is out of our
    # hands until the dependency moves or is replaced.
    ignore::DeprecationWarning:jose.*
