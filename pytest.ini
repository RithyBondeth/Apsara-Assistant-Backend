[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    # app-wide use of datetime.utcnow(). Moving off it means making the model
    # columns timezone-aware, which is a migration rather than a test change.
    ignore:datetime.datetime.utcnow:DeprecationWarning
    ignore::DeprecationWarning:passlib.*
