name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The models use the postgresql UUID dialect and SELECT ... FOR UPDATE, so
    # the suite needs a real Postgres rather than an in-memory stand-in.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apsara_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apsara_test_db
      SECRET_KEY: ci-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check migrations match the models
        # Autogenerate should find nothing to do. A model changed without a
        # migration passes every test and then fails on deploy.
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run tests
        run: pytest
